<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="Ulises Britos résumé in English and Spanish.">
  <title>Ulises Britos · Résumé</title>
  <style>
    :root { color-scheme:light; font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; color:#252b35; }
    * { box-sizing:border-box; }
    body { margin:0; }
    .page { display:flex; flex-direction:column; gap:12px; width:min(100%,1120px); height:100vh; height:100dvh; min-height:400px; margin:0 auto; padding:16px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
    h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.02em; }
    .languages { display:inline-flex; gap:3px; padding:3px; border:1px solid #d9dde3; border-radius:10px; background:#e8ebef; }
    .languages button { appearance:none; border:0; border-radius:7px; padding:8px 17px; background:transparent; color:#596372; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
    .languages button[aria-pressed="true"] { background:white; color:#202a38; box-shadow:0 1px 4px #17213617; }
    button:focus-visible, a:focus-visible { outline:3px solid #5178c3; outline-offset:3px; }
    .viewer { flex:1; min-height:0; overflow:hidden; border:1px solid #d9dde3; border-radius:10px; background:white; box-shadow:0 8px 30px #1721360b; }
    iframe { display:block; width:100%; height:100%; border:0; }
    .fallback { margin:0; font-size:13px; }
    @media (max-width:560px) { .page { gap:10px; padding:10px; } .languages button { padding:8px 12px; } .viewer { border-radius:6px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="toolbar">
      <h1 id="heading">Ulises Britos · Résumé</h1>
      <div class="languages" role="group" aria-label="Résumé language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="es" aria-pressed="false" lang="es">Español</button>
      </div>
    </header>
    <div class="viewer">
      <iframe id="pdf" title="English résumé (PDF)" loading="eager">
        <p class="fallback"><a href="./cv.pdf">View the PDF</a></p>
      </iframe>
    </div>
    <noscript>
      <p class="fallback"><a href="./cv.pdf">English PDF</a> ·
        <a href="./cv_es.pdf" lang="es">PDF en español</a></p>
    </noscript>
  </main>
  <script>
    (() => {
      const choices = {
        en: { file:"./cv.pdf", heading:"Résumé", title:"English résumé (PDF)" },
        es: { file:"./cv_es.pdf", heading:"Currículum", title:"Currículum en español (PDF)" }
      };
      const frame = document.getElementById("pdf");
      const heading = document.getElementById("heading");
      const buttons = document.querySelectorAll("[data-lang]");

      function setLanguage(lang, updateUrl) {
        const selected = lang === "es" ? "es" : "en";
        const choice = choices[selected];
        if (frame.dataset.lang !== selected) {
          frame.src = choice.file + "#view=FitH";
          frame.dataset.lang = selected;
        }
        frame.title = choice.title;
        heading.textContent = "Ulises Britos · " + choice.heading;
        document.title = "Ulises Britos · " + choice.heading;
        document.documentElement.lang = selected;
        buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === selected)));
        if (updateUrl) {
          const url = new URL(location.href);
          if (selected === "es") url.searchParams.set("lang", "es");
          else url.searchParams.delete("lang");
          history.replaceState(null, "", url);
        }
      }
      buttons.forEach(button => button.addEventListener("click", () => setLanguage(button.dataset.lang, true)));
      window.addEventListener("popstate", () => setLanguage(new URLSearchParams(location.search).get("lang"), false));
      setLanguage(new URLSearchParams(location.search).get("lang"), false);
    })();
  </script>
</body>
</html>
